syntax = "proto3";

option csharp_namespace = "BuildingBlocks.Grpc";

package billing;

service BillingGrpcService {
  rpc CheckAndWithdrawBet (BetRequest) returns (BetResponse);
  rpc CreditWin (WinRequest) returns (WinResponse);
}

message BetRequest {
  string player_id = 1;
  string amount = 2;
  string currency = 3;
  string game_id = 4;
}

message BetResponse {
  bool is_success = 1;
  string transaction_id = 2;
  string error_code = 3;
}

message WinRequest {
  string player_id = 1;
  string amount = 2;
  string currency = 3;
  string game_id = 4;
}

message WinResponse {
  string transaction_id = 1;
}
