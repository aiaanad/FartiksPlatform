name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем последнее состояние кода (без истории гита — экономит трафик)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 2. Устанавливаем .NET SDK 10 версии (поддержка вашего TargetFramework)
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        # Встроенное в экшен кэширование пакетов. Оно само создаст кэш на основе вашего .sln
        cache: true
        cache-dependency-path: '**/packages.lock.json' # Или просто по структуре проекта

    # 3. Восстанавливаем пакеты (если кэш сработал, этот шаг займет пару секунд вместо минут)
    - name: Restore dependencies
      run: dotnet restore FartiksPlatform.slnx

    # 4. Проверка линтера (Форматирование кода по вашему .editorconfig)
    - name: Check Code Formatting (Lint)
      run: dotnet format FartiksPlatform.slnx --verify-no-changes

    # 5. Сборка всего решения в режиме Release (флаг --no-restore запрещает повторный выход в интернет)
    - name: Build Solution
      run: dotnet build FartiksPlatform.slnx --configuration Release --no-restore

    # 6. Запуск всех тестов (флаг --no-build гарантирует, что мы не тратим ресурсы на пересборку)
    - name: Run Tests
      run: dotnet test FartiksPlatform.slnx --configuration Release --no-build --verbosity minimal

  docker-lint:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 7. Проверка работоспособности сборки docker-compose
    - name: Verify Docker Compose Configuration
      run: docker compose config