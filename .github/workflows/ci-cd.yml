name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Restore dependencies
      run: dotnet restore FartiksPlatform.slnx

    - name: Build Solution
      run: dotnet build FartiksPlatform.slnx --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test FartiksPlatform.slnx --configuration Release --no-build --verbosity minimal

  docker-lint:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Verify Docker Compose Configuration
      run: docker compose config
